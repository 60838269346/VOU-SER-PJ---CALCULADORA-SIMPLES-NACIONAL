<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples Nacional Completa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 p-4">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold text-center mb-6">Simulador PJ Profissional</h2>
        
        <div class="space-y-4">
            <select id="atividade" class="w-full p-3 border rounded-lg text-sm bg-gray-100 cursor-pointer">
                <option value="III">Assessoria Gerencial - Anexo III</option>
                <option value="V">Tecnologia/Engenharia - Anexo V (Fator R)</option>
            </select>

            <input type="number" id="faturamento" placeholder="Faturamento Mensal (R$)" class="w-full p-3 border rounded-lg text-sm" value="9500">
            <input type="number" id="provisoes" placeholder="Provisões / Adicionais (R$)" class="w-full p-3 border rounded-lg text-sm" value="4607.20">

            <div class="p-4 bg-gray-100 rounded-lg">
                <p class="text-sm font-semibold text-gray-700">Painel Base Consolidada (Foco PJ):</p>
                <p id="baseConsolidada" class="text-xl font-bold text-blue-600">R$ 14.107,20</p>
            </div>

            <button onclick="calcular()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">Calcular Comparativo</button>

            <div id="resultado" class="mt-4 p-4 border rounded-lg bg-gray-50 hidden">
                <h3 class="font-bold text-lg mb-2">Resultado:</h3>
                <p>Imposto PJ sobre a Base Consolidada: <span id="valImposto" class="font-semibold">R$ 0,00</span></p>
            </div>
        </div>
    </div>

    <script>
        function calcular() {
            let faturamento = parseFloat(document.getElementById('faturamento').value) || 0;
            let provisoes = parseFloat(document.getElementById('provisoes').value) || 0;
            
            // CORREÇÃO APLICADA: A base do PJ agora puxa o total consolidado (Faturamento + Provisões)
            let baseCalculoPJ = faturamento + provisoes;
            
            document.getElementById('baseConsolidada').innerText = 'R$ ' + baseCalculoPJ.toLocaleString('pt-BR', {minimumFractionDigits: 2});

            // Exemplo de alíquota efetiva simulada (Substitua pela sua lógica real do Simples Nacional)
            let aliquotaSimplesNacional = 0.06; 
            let impostoPJ = baseCalculoPJ * aliquotaSimplesNacional;

            document.getElementById('valImposto').innerText = 'R$ ' + impostoPJ.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            document.getElementById('resultado').classList.remove('hidden');
        }
    </script>
</body>
</html>
